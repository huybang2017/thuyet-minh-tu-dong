services:
  mongo:
    image: mongo:7
    ports: ["27018:27017"]
    volumes: [mongo_data:/data/db]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  backend:
    build: ./backend
    env_file: .env
    environment:
      MONGO_URL: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    volumes: [./backend/app:/srv/app, ./backend/tests:/srv/tests]
    depends_on: [mongo, redis]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
volumes:
  mongo_data:
